name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t linkpeek .
      - name: Smoke test container
        run: |
          docker run -d --name linkpeek -p 8000:8000 linkpeek
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/preview?url=http://169.254.169.254/')" = 400
          test "$(docker exec linkpeek id -u)" = 10001
